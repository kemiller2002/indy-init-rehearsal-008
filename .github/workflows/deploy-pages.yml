name: Deploy to GitHub Pages

# Retired in favour of deploy.yml (WI-R8-T11): Causa's approved Pages workflow is
# deploy.yml, which builds the WebAssembly site and checks the deployment. This
# Conditor scaffold no longer runs on push; it remains for manual use only and
# shares the `pages` concurrency group with deploy.yml, so the two never publish
# concurrently. It deploys what `npm run build` writes to dist/. See DEPLOYMENT.md.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.DEPLOY_TARGET == 'github-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install npm dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            echo "::warning::package-lock.json is not committed; installing without a lockfile. Commit it so every run installs the same tree."
            npm install --no-audit --no-fund
          fi

      - name: Build the site
        run: npm run build

      - name: Require the site bundle
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::npm run build must write the deployable site, including dist/index.html. See DEPLOYMENT.md."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
