<!doctype html>
<!-- Owner: integration (v4.1.1 X18). The loading shell and the Limen-bound application root. UI roles change this
     file only through an integration-owned change request. The shell renders before WebAssembly starts
     (WASM-LOAD-001); boundary.js boots the F# engine through Limen and hands off on the engine's first projection. -->
<html lang="en" data-engine="loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Causa</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%23345' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23345'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./node_modules/@echelon-foundry/design-system/dist/all.css">
  <link rel="stylesheet" href="./causa.css">
  <script type="importmap">
    {
      "imports": {
        "@echelon-foundry/limen": "./node_modules/@echelon-foundry/limen/dist/index.js"
      }
    }
  </script>
  <script type="module" src="./boundary.js"></script>
</head>
<body>
  <!-- Loading shell: static HTML and CSS only, so it shows even when WebAssembly never starts. -->
  <section class="causa-loading" data-causa-loading aria-labelledby="causa-loading-title">
    <svg class="causa-mark" viewBox="0 0 32 32" role="img" aria-labelledby="causa-mark-title">
      <title id="causa-mark-title">Causa</title>
      <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="4"/>
      <circle cx="16" cy="16" r="4" fill="currentColor"/>
    </svg>
    <h1 id="causa-loading-title">Causa</h1>
    <p class="causa-loading-status" role="status" aria-live="polite" data-causa-load-status>Starting Causa…</p>
    <span class="causa-loading-indicator" aria-hidden="true"></span>
    <div class="causa-loading-failed" data-causa-load-failed hidden>
      <p role="alert">Causa could not start. Check your connection and try again.</p>
      <ef-button><button type="button" data-causa-retry>Retry</button></ef-button>
    </div>
  </section>

  <!-- Application root: every binding below is projected by the F# engine (Causa.App View.fs). -->
  <main class="causa-app" data-causa-app hidden>
    <h1>Causa</h1>
    <p data-text="status">Loading Causa</p>
    <p hidden>Engine <span data-text="engine"></span> at <span data-text="path"></span></p>
  </main>
</body>
</html>
